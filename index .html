<!doctype html>
<html lang="ja">
<head>

<title>一年戦争100問</title>

<style>
/* Layout: 作戦ブリーフィング端末 — 上に戦況バー、中央に1問ずつのカード、下に操作。一覧モードで全問を見渡せる */
:root{
  --bg:#eef0f2; --panel:#ffffff; --ink:#151a22; --muted:#5b6574; --line:#d3d8df;
  --blue:#1f4fa8; --red:#c62828; --yellow:#e8b100; --ok:#2e7d4f; --ng:#b3261e;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --panel:#181e27; --ink:#e8ecf2; --muted:#9aa5b5; --line:#2b3442;
  --blue:#6f9bf0; --red:#ef6b63; --yellow:#f2c53d; --ok:#5fc48a; --ng:#f07a72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1319; --panel:#181e27; --ink:#e8ecf2; --muted:#9aa5b5; --line:#2b3442;
  --blue:#6f9bf0; --red:#ef6b63; --yellow:#f2c53d; --ok:#5fc48a; --ng:#f07a72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;padding:0 16px}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
.stripe{display:flex;height:6px;border-radius:2px;overflow:hidden;width:96px}
.stripe i{flex:1}.stripe i:nth-child(1){background:var(--blue)}.stripe i:nth-child(2){background:var(--red)}.stripe i:nth-child(3){background:var(--yellow)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,44px);line-height:1.15;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:14px}
.tabs,.cats{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.status div{border-top:2px solid var(--line);padding-top:6px}
.status b{display:block;font-size:22px}
.status span{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.status .o{border-color:var(--ok)}.status .x{border-color:var(--ng)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 22px;display:flex;flex-direction:column;gap:16px;min-height:280px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.tag{border:1px solid currentColor;border-radius:4px;padding:1px 6px;font-family:var(--body)}
.q{font-size:clamp(19px,4.6vw,23px);font-weight:700;line-height:1.55;margin:0;text-wrap:pretty}
.ans{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.ans .a{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,26px);color:var(--red);line-height:1.35}
.ans .n{font-size:14px;color:var(--muted)}
.reveal{margin-top:auto;align-self:stretch;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:14px;font-weight:700;font-size:16px}
.judge{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge button{border:2px solid;border-radius:8px;padding:12px;font-weight:700;background:transparent}
.judge .ok{border-color:var(--ok);color:var(--ok)}.judge .ng{border-color:var(--ng);color:var(--ng)}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:14px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .no{font-family:var(--mono);color:var(--muted);font-size:13px;padding-top:2px;font-variant-numeric:tabular-nums}
.row p{margin:0}
.row .ra{color:var(--red);font-weight:700}
.row .ra span{color:var(--muted);font-weight:400;font-size:13px}
.done{text-align:center;gap:10px;justify-content:center}
.done .big{font-family:var(--display);font-size:56px;color:var(--blue);line-height:1}
footer{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{margin:0}
</style>
</head>

<div class="wrap">
  <header>
    <div class="stripe"><i></i><i></i><i></i></div>

    <h1>一年戦争100問</h1>

  </header>

  <div class="tabs" role="group" aria-label="モード">
    <button class="chip" id="m-quiz" aria-pressed="true">1問ずつ</button>
    <button class="chip" id="m-list" aria-pressed="false">一覧で見る</button>
  </div>
  <div class="cats" id="cats" role="group" aria-label="ジャンル"></div>

  <section id="quiz">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="status">

        <div class="o"><b id="s-ok">0</b><span>正解</span></div>
        <div class="x"><b id="s-ng">0</b><span>不正解</span></div>
      </div>
      <div class="bar"><i id="bar" style="width:0"></i></div>
      <article class="card" id="card"></article>
      <div class="nav">
        <button class="ghost" id="prev">← 前へ</button>
        <button class="ghost" id="shuffle">シャッフルして最初から</button>
        <button class="ghost" id="retry">×だけ解き直す</button>
        <button class="ghost" id="next">次へ →</button>
      </div>
    </div>
  </section>

  <section id="list" hidden><div class="list" id="listBody"></div></section>

  <footer>内容は放送当時の設定・劇中描写に基づいています。後年の作品で設定が変わった項目もあります。</footer>
</div>

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st=store.get("g100")||{};
let cat=st.cat||"すべて", order=st.order||null, pos=st.pos||0, marks=st.marks||{}, shown=false, mode="quiz";

function pool(){return Q.map((q,i)=>i).filter(i=>cat==="すべて"||Q[i][0]===cat)}
function setOrder(ids){order=ids;pos=0;shown=false;save();render()}
if(!order||!order.every(i=>Q[i])) order=pool();
function save(){store.set("g100",{cat,order,pos,marks})}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderCats(){
  $("cats").innerHTML=CATS.map(c=>{const n=c==="すべて"?Q.length:Q.filter(q=>q[0]===c).length;
    return `<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${c} ${n}</button>`}).join("");
}
$("cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.c;renderCats();setOrder(pool());renderList()};

function render(){
  const ids=order, total=ids.length;
  const ok=ids.filter(i=>marks[i]===1).length, ng=ids.filter(i=>marks[i]===0).length;
  $("s-ok").textContent=ok;$("s-ng").textContent=ng;
  $("s-pos").textContent=Math.min(pos+1,total)+"/"+total;
  $("bar").style.width=(total?(ok+ng)/total*100:0)+"%";
  const card=$("card");
  if(pos>=total){
    card.className="card done";
    card.innerHTML=`<div class="eyebrow">作戦終了</div><div class="big">${ok}<small style="font-size:22px"> / ${total}</small></div>
      <p style="margin:0">${ok===total?"完璧です。ニュータイプの素養ありですね。":ng?"×の問題だけ解き直して、全問正解を目指しましょう。":"お疲れさまでした。"}</p>`;
    return;
  }
  card.className="card";
  const i=ids[pos], q=Q[i], m=marks[i];
  card.innerHTML=`<div class="qmeta"><span>Q.${String(i+1).padStart(3,"0")}</span><span class="tag">${q[0]}</span></div>
    <p class="q">${esc(q[1])}</p>
    ${shown?`<div class="ans"><div class="a">${esc(q[2])}</div>${q[3]?`<div class="n">${esc(q[3])}</div>`:""}</div>
      <div class="judge"><button class="ok" id="j1">〇 正解</button><button class="ng" id="j0">× 不正解</button></div>`
     :`${m!==undefined?`<div class="n" style="color:var(--muted);font-size:13px">前回：${m?"〇":"×"}</div>`:""}<button class="reveal" id="rv">答えを見る</button>`}`;
  if(shown){$("j1").onclick=()=>judge(1);$("j0").onclick=()=>judge(0);$("j1").focus()}
  else $("rv").onclick=()=>{shown=true;render()};
}
function judge(v){marks[order[pos]]=v;pos++;shown=false;save();render();renderList()}
$("next").onclick=()=>{if(pos<order.length){pos++;shown=false;save();render()}};
$("prev").onclick=()=>{if(pos>0){pos--;shown=false;save();render()}};
$("shuffle").onclick=()=>{const ids=shuffle(pool());ids.forEach(i=>delete marks[i]);setOrder(ids);renderList()};
$("retry").onclick=()=>{const ids=pool().filter(i=>marks[i]===0);if(!ids.length){$("retry").textContent="×はありません";setTimeout(()=>$("retry").textContent="×だけ解き直す",1500);return}
  ids.forEach(i=>delete marks[i]);setOrder(shuffle(ids))};
document.addEventListener("keydown",e=>{if(mode!=="quiz"||e.target.closest("button"))return;
  if(e.key===" "&&!shown&&pos<order.length){e.preventDefault();shown=true;render()}});

function renderList(){
  $("listBody").innerHTML=pool().map(i=>{const q=Q[i];const m=marks[i];
    return `<div class="row"><div class="no">${String(i+1).padStart(3,"0")}${m===1?" 〇":m===0?" ×":""}</div>
      <div><p>${esc(q[1])}</p><p class="ra">${esc(q[2])}${q[3]?` <span>— ${esc(q[3])}</span>`:""}</p></div></div>`}).join("");
}
function setMode(m){mode=m;$("m-quiz").setAttribute("aria-pressed",m==="quiz");$("m-list").setAttribute("aria-pressed",m==="list");
  $("quiz").hidden=m!=="quiz";$("list").hidden=m!=="list";}
$("m-quiz").onclick=()=>setMode("quiz");$("m-list").onclick=()=>setMode("list");

renderCats();render();renderList();
</script>
</body>
</html>
